<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Effort 썸네일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0f1115}
body{font-family:Pretendard,sans-serif;color:#fff;position:relative}
.tag{position:absolute;top:56px;left:72px;background:#d97757;color:#fff;font-weight:800;font-size:34px;padding:10px 24px;border-radius:14px}
h1{position:absolute;top:140px;left:72px;font-size:92px;font-weight:900;line-height:1.1;letter-spacing:-3px}
h1 em{font-style:normal;color:#ffd166}
.row{position:absolute;left:72px;right:72px;bottom:72px;display:flex;gap:24px}
.lv{flex:1;border-radius:22px;padding:28px 0;text-align:center;font-weight:900;font-size:60px;letter-spacing:-1px}
.low{background:#2a9d8f}.med{background:#3a3f4b;color:#aab}.high{background:#3a3f4b;color:#aab}.max{background:#e63946;box-shadow:0 0 0 6px #ffd166}
.q{position:absolute;right:72px;top:150px;font-size:200px;font-weight:900;color:#ffd166;opacity:.9}
</style></head><body>
<div class="tag">클로드 코드 effort</div>
<h1>언제 <em>low</em>,<br>언제 <em>max</em>?</h1>
<div class="q">?</div>
<div class="row"><div class="lv low">LOW</div><div class="lv med">MED</div><div class="lv high">HIGH</div><div class="lv max">MAX</div></div>
</body></html>
