<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:"Apple SD Gothic Neo",sans-serif}
#stage{position:absolute;inset:0}
.word{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:center;transform:translateY(-50%)}
.ch{display:inline-block;font-weight:800;font-size:190px;letter-spacing:-6px;will-change:transform}
.sub{position:absolute;left:0;right:0;top:570px;text-align:center;font-size:30px;font-weight:500;letter-spacing:.5px}
</style>
</head><body>
<div id="stage"></div>
<script>
// 05 키네틱 타이포 — 순수 HTML/CSS. 글자마다 transform을 시간 함수로 계산한다.
const FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const back = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeIn = x => x * x * x;

// [단어, 시작, 끝, 배경, 글자색, 등장 방식]
const WORDS = [
  ['코드가', 0, 1.6, '#1f1e1d', '#f4efe6', 'drop'],
  ['영상이', 1.5, 3.1, '#d97757', '#1f1e1d', 'spin'],
  ['된다', 3.0, 4.6, '#f4efe6', '#1f1e1d', 'scale'],
  ['KINETIC', 4.5, 6.2, '#6a9bcc', '#f4efe6', 'wave'],
];
const stage = document.getElementById('stage');
const els = WORDS.map(([w]) => {
  const d = document.createElement('div'); d.className = 'word';
  d.innerHTML = [...w].map(c => `<span class="ch">${c}</span>`).join('');
  stage.appendChild(d); return d;
});
const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = '글자 하나하나가 시간의 함수'; stage.appendChild(sub);

window.renderFrame = f => {
  const t = f / FPS;
  const cur = WORDS.findLast(w => t >= w[1]) || WORDS[0];
  document.body.style.background = cur[3];
  WORDS.forEach(([w, s, e, , fg, mode], wi) => {
    const el = els[wi];
    el.style.display = t >= s && t < e ? 'flex' : 'none';
    [...el.children].forEach((ch, i) => {
      const n = el.children.length;
      const pin = back(prog(t, s + i * .07, s + .45 + i * .07));
      const pout = easeIn(prog(t, e - .35 + i * .03, e - .05 + i * .03));
      let tf = '';
      if (mode === 'drop') tf = `translateY(${(1 - pin) * -420}px) rotate(${(1 - pin) * -25}deg)`;
      if (mode === 'spin') tf = `rotateY(${(1 - pin) * 180}deg) scale(${.4 + .6 * pin})`;
      if (mode === 'scale') tf = `scale(${pin}) translateY(${Math.sin(t * 8 + i) * 8}px)`;
      if (mode === 'wave') tf = `translateY(${(1 - pin) * 300 + Math.sin(t * 6 - i * .6) * 30}px)`;
      tf += ` translateX(${pout * (i - n / 2) * 160}px) scale(${1 - pout * .6})`;
      ch.style.transform = tf; ch.style.opacity = Math.min(clamp(pin * 2), 1 - pout);
      ch.style.color = fg;
    });
  });
  sub.style.color = cur[4]; sub.style.opacity = prog(t, .6, 1.0) * .7;
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body></html>
