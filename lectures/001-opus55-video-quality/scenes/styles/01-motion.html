<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#f4efe6}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 01 모션그래픽 — Canvas 2D. 점 → 원 → 격자 → 로고로 모핑
const W = 1280, H = 720, FPS = 30, DURATION = 6;
const g = document.getElementById('c').getContext('2d');
const COLS = ['#d97757', '#6a9bcc', '#b5c77a', '#e8b04a', '#1f1e1d'];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const N = 36;

// 세 가지 배치: 원형, 격자, 파도
const ring = i => { const a = i / N * Math.PI * 2 - Math.PI / 2; return [W / 2 + Math.cos(a) * 230, H / 2 + Math.sin(a) * 230]; };
const grid = i => [W / 2 + ((i % 9) - 4) * 90, H / 2 + (Math.floor(i / 9) - 1.5) * 90];
const wave = (i, t) => [120 + i * (1040 / (N - 1)), H / 2 + Math.sin(i * .45 + t * 5) * 120];

window.renderFrame = f => {
  const t = f / FPS;
  g.fillStyle = '#f4efe6'; g.fillRect(0, 0, W, H);
  const p1 = ease(prog(t, .8, 1.8)), p2 = ease(prog(t, 2.4, 3.4)), p3 = ease(prog(t, 4.0, 5.0));
  for (let i = 0; i < N; i++) {
    const appear = back(prog(t, i * .012, .4 + i * .012));
    let [x, y] = [W / 2, H / 2];
    const r = ring(i), gr = grid(i), wv = wave(i, t);
    x = lerp(x, r[0], p1); y = lerp(y, r[1], p1);
    x = lerp(x, gr[0], p2); y = lerp(y, gr[1], p2);
    x = lerp(x, wv[0], p3); y = lerp(y, wv[1], p3);
    const size = Math.max(0, 26 * appear * (1 + .25 * Math.sin(t * 4 + i)));
    const sq = Math.sin(p2 * Math.PI); // 격자로 갈 때만 사각형으로 변신
    g.save(); g.translate(x, y); g.rotate(p2 * Math.PI / 2 + i * .1 * sq);
    g.fillStyle = COLS[i % COLS.length];
    g.beginPath(); g.roundRect(-size, -size, size * 2, size * 2, Math.max(0, size * (1 - .7 * sq))); g.fill();
    g.restore();
  }
  // 중앙 타이틀: 원형 배치일 때만
  const ta = prog(t, 1.4, 1.8) * (1 - prog(t, 2.3, 2.6));
  if (ta > 0) {
    g.globalAlpha = ta; g.fillStyle = '#1f1e1d'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '800 64px "Apple SD Gothic Neo"'; g.fillText('MOTION', W / 2, H / 2);
    g.globalAlpha = 1;
  }
};
window.READY = true;
</script>
</body></html>
