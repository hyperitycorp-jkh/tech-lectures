<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 04 셰이더 — 순수 WebGL 프래그먼트 셰이더. 픽셀마다 GPU가 색을 계산한다.
// 도메인 워핑한 fbm 노이즈 + 팔레트 함수
const FPS = 30;
const gl = document.getElementById('c').getContext('webgl', { preserveDrawingBuffer: true });
const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const fs = `
precision highp float;
uniform float uTime; uniform vec2 uRes;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0., a = .5; for(int i=0;i<6;i++){ v += a*noise(p); p = p*2.02 + 3.1; a *= .5; } return v; }
vec3 palette(float t){ return .5 + .5*cos(6.2831*(vec3(1.,.9,.8)*t + vec3(.0,.15,.3))); }
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes) / uRes.y;
  float t = uTime * .35;
  vec2 q = vec2(fbm(uv*2. + t), fbm(uv*2. - t + 5.2));
  vec2 r = vec2(fbm(uv*2. + 4.*q + vec2(1.7, 9.2) + .6*t), fbm(uv*2. + 4.*q + vec2(8.3, 2.8) - .5*t));
  float v = fbm(uv*2. + 4.*r);
  vec3 col = palette(v*1.4 + length(q)*.6 + uTime*.05);
  col = mix(col, vec3(.95,.45,.3), smoothstep(.55,.95,length(r)) * .6);
  col *= 1. - .35*length(uv);                 // 비네트
  float ring = smoothstep(.012, .0, abs(length(uv) - (.18 + .05*sin(uTime*2.))));
  col += ring * .8;
  gl_FragColor = vec4(pow(col, vec3(.9)), 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uTime = gl.getUniformLocation(prog, 'uTime');
gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), 1280, 720);

window.renderFrame = f => { gl.uniform1f(uTime, f / FPS + 3); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish(); };
window.READY = true;
</script>
</body></html>
