<!doctype html>
<html><head><meta charset="utf-8">
<!-- 브랜드 티저 템플릿 (9:16 1080×1920 기본, ?ar=169 이면 16:9 1920×1080). 아이폰 광고 티저처럼 빠른 템포.
     구성: 1초 훅(누구나 겪어 본 장면) → 검은 화면 큰 글자(박자마다 쾅) → 드롭(한 박자 한 단어 + 배경 컷) → 실제 앱 화면 → 브랜드 한 줄 + 로고
     모든 시각은 박자 번호로 계산한다(BPM). 배경음 프리셋 'teaser' 가 같은 BPM 으로 쾅·라이저·드롭을 만든다 → 화면과 소리가 같은 프레임에 맞는다.
     렌더: node toolkit/render.mjs <장면 폴더>/teaser.html   ·   썸네일용 정지: --still --query f=120 -->
<style>
:root{--dark:#0b0b0c;--light:#fbf8f1;--ink:#1f1e1d;--acc:#f2c94c}
html,body{margin:0;overflow:hidden;background:var(--dark);font-family:"Pretendard",sans-serif}
.abs{position:absolute}
.cover{width:100%;height:100%;object-fit:cover}
#stage{inset:0;overflow:hidden}
#bgA{inset:0}
#shade{inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35) 40%,rgba(0,0,0,.82))}
#big{left:6%;right:6%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;letter-spacing:-.04em;line-height:1.08;white-space:pre-line;word-break:keep-all}
#hook{left:7%;right:7%;display:flex;justify-content:center;text-align:center;font-weight:800;letter-spacing:-.03em;line-height:1.3;color:#fff;white-space:pre-line;word-break:keep-all;text-shadow:0 4px 24px rgba(0,0,0,.5)}
#phone{left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
#phone img{max-width:100%;max-height:100%;height:100%;object-fit:contain}
#brand{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5%}
#brand img{width:22%;border-radius:22%}
#brand p{margin:0;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:pre-line;word-break:keep-all}
#brandSub{font-weight:600!important;opacity:.7}
#flash{inset:0;background:#fff}
#sub{left:8%;right:8%;text-align:center;font-weight:600;letter-spacing:-.01em;white-space:pre-line;word-break:keep-all}
#big.strike span{text-decoration:line-through;text-decoration-thickness:.09em}
</style>
<script src="/toolkit/templates/lib.js"></script>
</head><body>
<div class="abs" id="stage">
  <div class="abs" id="bgA"><img class="cover" id="bgImg"></div>
  <div class="abs" id="shade"></div>
  <div class="abs" id="phone"><img id="phoneImg"></div>
  <div class="abs" id="big"></div>
  <div class="abs" id="hook"></div>
  <div class="abs" id="sub"></div>
  <div class="abs" id="brand"><img id="logo"><p id="brandLine"></p><p id="brandSub"></p></div>
  <div class="abs" id="flash"></div>
</div>
<script>
// ── 여기만 고친다 ─────────────────────────────────────────────
// 원칙: 기능 설명 말고 앱이 주는 가치를 이야기로. 첫 1초는 누구나 겪어 본 장면. 앱 화면은 실제 화면만. 마지막은 브랜드 한 줄 + 로고.
const CONTENT = {
  bpm: 124,
  audio: 'teaser',              // 코드 합성 배경음 (박자에 맞춤). 곡 파일을 쓰려면 musicFile: '곡.mp3' (bpm 은 그 곡에 맞출 것)
  musicFile: null,
  colors: { dark: '#0b0b0c', light: '#fbf8f1', ink: '#1f1e1d', accent: '#f2c94c' },
  fontFace: null,               // 브랜드 폰트: { family: 'Brand', url: '/경로/font.ttf' } — 없으면 Pretendard
  hook:   { beats: 4, image: '/toolkit/templates/sample-left.svg', text: '누구나 겪어 본\n그 장면 하나' },
  open:   { beatsPer: 2, words: ['이제', '달라져요'] },                 // 검은 화면, 단어마다 쾅
  // 드롭: 한 박자에 한 단어. 단어마다 image(+blur px) 또는 bg(단색), color(글자색), strike(취소선 — '기존 방식' 대비), sub(작은 글씨: 출처·설명)
  drop:   { words: [
    { text: '빠르게', image: '/toolkit/templates/sample-right.svg' },
    { text: '쉽게',   image: '/toolkit/templates/sample-left.svg' },
    { text: '매일',   image: '/toolkit/templates/sample-right.svg' },
    { text: '함께',   image: '/toolkit/templates/sample-left.svg' } ] },
  screens: { beats: 8, image: '/toolkit/templates/sample-right.svg' },  // 실제 앱 화면: image · images(여러 장, 박자마다 넘김) · clip(PNG 시퀀스 폴더)
  brand:  { beats: 8, line: '브랜드 한 줄', sub: '', logo: '/toolkit/templates/sample-right.svg' },  // sub: 문의처·다운로드 등 한 줄
};
// ────────────────────────────────────────────────────────────

const WIDE = new URLSearchParams(location.search).get('ar') === '169';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920, FPS = 30, S = W / 1080;  // S: 글자 크기 기준
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
Object.entries(CONTENT.colors).forEach(([k, v]) => document.documentElement.style.setProperty('--' + (k === 'accent' ? 'acc' : k), v));
if (CONTENT.fontFace) document.head.insertAdjacentHTML('beforeend', `<style>@font-face{font-family:'${CONTENT.fontFace.family}';src:url('${CONTENT.fontFace.url}')}</style>`);
const TITLE = CONTENT.fontFace ? `'${CONTENT.fontFace.family}', Pretendard, sans-serif` : 'Pretendard, sans-serif';
$('brandLine').style.fontFamily = TITLE;  // 브랜드 폰트는 마지막 한 줄에만 — 큰 글자·훅은 굵은 고딕이 더 세다

// 박자 타임라인
const B = 60 / CONTENT.bpm;
const OPEN = CONTENT.hook.beats, DROP = OPEN + CONTENT.open.words.length * CONTENT.open.beatsPer;
const SCREENS = DROP + CONTENT.drop.words.length, END = SCREENS + CONTENT.screens.beats, TOTAL = END + CONTENT.brand.beats;
window.META = { W, H, FPS, DURATION: +(TOTAL * B + 1).toFixed(2), AUDIO: CONTENT.audio, BPM: CONTENT.bpm, DROP_BEAT: DROP, END_BEAT: END,
  ...(CONTENT.musicFile ? { MUSIC_FILE: CONTENT.musicFile } : {}), STILL_FRAME: +(new URLSearchParams(location.search).get('f') || 0) };

async function setImg(img, src) { if (src && img.getAttribute('src') !== src) { img.src = src; await img.decode(); } }
const punch = x => 1 + .28 * Math.exp(-x * 14);           // 박자 직후 크게 → 제자리
const ALL = ['bgA', 'shade', 'phone', 'big', 'hook', 'sub', 'brand', 'flash'];

window.renderFrame = async f => {
  const t = f / FPS, beat = t / B, bi = Math.floor(beat), since = (beat - bi) * B;  // since: 이번 박자가 시작된 뒤 초
  ALL.forEach(id => show($(id), 0));
  const stage = $('stage'); stage.style.transform = '';
  document.body.style.background = 'var(--dark)';

  if (bi < OPEN) {                                          // 1초 훅: 첫 프레임부터 장면 + 한 줄
    await setImg($('bgImg'), CONTENT.hook.image); $('bgImg').style.filter = CONTENT.hook.blur ? `blur(${CONTENT.hook.blur}px) brightness(.7)` : '';  // blur: 배경 글씨가 훅 문구와 섞일 때
    show($('bgA'), 1, 0, 1.08 - .08 * (beat / OPEN)); show($('shade'), 1);
    Object.assign($('hook').style, { fontSize: 76 * S + 'px', top: WIDE ? '62%' : '60%' });
    $('hook').textContent = CONTENT.hook.text; show($('hook'), 1);
  } else if (bi < DROP) {                                   // 검은 화면 큰 글자, 박자마다 쾅
    const k = Math.floor((bi - OPEN) / CONTENT.open.beatsPer), first = (bi - OPEN) % CONTENT.open.beatsPer === 0;
    $('big').className = 'abs'; $('big').textContent = CONTENT.open.words[k]; $('big').style.color = '#fff'; $('big').style.fontSize = (WIDE ? 190 : 170) * S + 'px';
    show($('big'), 1, 0, first ? punch(since) : 1 + .06 * Math.exp(-since * 14));
  } else if (bi < SCREENS) {                                // 드롭: 한 박자 한 단어 + 배경 컷
    const w = CONTENT.drop.words[bi - DROP];
    if (w.image) {
      await setImg($('bgImg'), w.image); $('bgImg').style.filter = w.blur ? `blur(${w.blur}px)` : '';
      show($('bgA'), 1, 0, 1.12 - .06 * (since / B)); show($('shade'), 1);
    } else document.body.style.background = w.bg || 'var(--dark)';
    $('big').innerHTML = `<span>${w.text}</span>`; $('big').className = 'abs' + (w.strike ? ' strike' : '');
    $('big').style.color = w.color || '#fff'; $('big').style.fontSize = (w.size || 1) * (WIDE ? 200 : 180) * S + 'px';
    if (w.sub) {
      Object.assign($('sub').style, { top: WIDE ? '76%' : '66%', fontSize: 38 * S + 'px', color: w.color || '#fff', opacity: .85 });
      $('sub').textContent = w.sub; show($('sub'), .85);
    }
    show($('big'), 1, 0, punch(since));
    stage.style.transform = `translate(${Math.sin(bi * 2.3) * 10 * Math.exp(-since * 20)}px, ${Math.cos(bi * 1.7) * 10 * Math.exp(-since * 20)}px)`;
    if (bi === DROP) show($('flash'), Math.max(0, 1 - since / .12));  // 드롭 첫 박자: 하얗게 번쩍
  } else if (bi < END) {                                    // 실제 앱 화면
    document.body.style.background = 'var(--light)';
    const sc = CONTENT.screens, local = Math.round((t - SCREENS * B) * FPS);
    // images 여러 장이면 같은 간격으로 넘긴다 (박자에 맞춰)
    const img = sc.images ? sc.images[Math.min(sc.images.length - 1, Math.floor((bi - SCREENS) / (sc.beats / sc.images.length)))] : sc.image;
    if (sc.clip) await CLIP.show($('phoneImg'), sc.clip, local); else await setImg($('phoneImg'), img);
    // 이미지는 여백을 두고, 클립(블렌더 폰 샷 등)은 이미 구도가 잡혀 있으니 꽉 채운다
    $('phone').style.padding = sc.clip ? '0' : (WIDE ? '6% 30%' : '10% 12%'); $('phone').style.boxSizing = 'border-box';
    show($('phone'), Math.min(1, (t - SCREENS * B) / .15));
  } else {                                                  // 브랜드 한 줄 + 로고
    document.body.style.background = 'var(--light)';
    await setImg($('logo'), CONTENT.brand.logo);
    $('brandLine').textContent = CONTENT.brand.line; $('brandLine').style.fontSize = (WIDE ? 64 : 70) * S + 'px';
    $('brandSub').textContent = CONTENT.brand.sub || ''; $('brandSub').style.fontSize = 36 * S + 'px';
    const e = t - END * B;
    show($('brand'), Math.min(1, e / .2), 0, punch(e) * .9 + .1);
  }
  document.body.style.opacity = 1 - prog(t, META.DURATION - .6, META.DURATION);
};
ready(['900 170px Pretendard']);
</script>
</body></html>
